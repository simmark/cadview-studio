name: CADVIEW static quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax, DOM IDs, PWA identity and render hooks
        run: node tests/check-release.mjs
