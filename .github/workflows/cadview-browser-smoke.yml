name: CADVIEW browser WebGL smoke test

on:
  workflow_dispatch:
  push:
    branches: [main, feature/mobile-immersive-cadview]
    paths:
      - mobile/**
      - tests/*.mjs
      - app.js
      - index.html
      - rework.css
      - enhancements.css
      - gui.js
      - sw.js
      - tests/browser-smoke.mjs
      - .github/workflows/cadview-browser-smoke.yml

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch local GitHub Pages equivalent
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/cadview-http.log 2>&1 &
          sleep 3
      - name: Capture reference viewports
        run: node tests/layout-screens.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cadview-layout
          path: artifacts/layout/
      - name: Validate live 3D interactions
        env:
          CADVIEW_URL: http://127.0.0.1:8765/
        run: node tests/browser-smoke.mjs
