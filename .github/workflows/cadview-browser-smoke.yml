name: CADVIEW browser WebGL smoke test

on:
  workflow_dispatch:
  push:
    branches: [main, feature/mobile-immersive-cadview]
    paths:
      - mobile/**
      - tests/*.mjs
      - app.js
      - index.html
      - rework.css
      - enhancements.css
      - gui.js
      - sw.js
      - tests/browser-smoke.mjs
      - .github/workflows/cadview-browser-smoke.yml

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    env:
      CADVIEW_URL: http://127.0.0.1:8765/cadview-studio/
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch local GitHub Pages equivalent
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pages/cadview-studio"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pages" > /tmp/cadview-http.log 2>&1 &
          sleep 3
      - name: Capture reference viewports
        run: node tests/layout-screens.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cadview-layout
          path: artifacts/layout/
      - name: Validate live 3D interactions
        run: node tests/browser-smoke.mjs

      - name: Validate touch, fullscreen, orientation and offline CAD import
        env:
          CADVIEW_STEP: /tmp/as1-oc-214.stp
        run: |
          curl --fail --location --retry 2 --output "$CADVIEW_STEP" https://raw.githubusercontent.com/kovacsv/occt-import-js/41e470890ae0f9dc69ac50ffd5fc73e03576f4eb/test/testfiles/cax-if/as1-oc-214.stp
          node tests/check-release.mjs
          node tests/gyro-controller.mjs
          node tests/mobile-inspection.mjs
